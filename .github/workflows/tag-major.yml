# Truncate pushed tags and force-push as a moving vN major version tag (necessary for workflow_call)
# This workflow assumes the latest tag is the "highest" for its vMajor
name: Tag Major Version

on:
  push:
    tags:
      - "v*.*.*"
  workflow_call:

jobs:
  bump:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          tag: ${{github.ref}}
        run: |
          tag=${tag#refs/tags/}
          major=${tag%%.*}
          git push -f origin "HEAD:refs/tags/$major"
